name: Probe official Ubiquiti APT metadata (one-time)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apt-metadata-probe.yml'
permissions:
  contents: read
jobs:
  official-apt-probe:
    if: github.repository == 'tAIwan888/unifi-skill' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check public, documented Ubiquiti APT metadata (no credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib import request, robotparser, parse, error
          from hashlib import sha256
          ua = 'UniFiSkillPublicKnowledgeMonitor/0.8'
          url = 'https://www.ui.com/downloads/unifi/debian/dists/stable/InRelease'
          robots_url='https://www.ui.com/robots.txt'
          try:
              with request.urlopen(request.Request(robots_url,headers={'User-Agent':ua}),timeout=12) as r:
                  raw_robots=r.read(65537)
              if len(raw_robots)>65536:raise ValueError('robots_too_large')
              rp=robotparser.RobotFileParser()
              rp.parse(raw_robots.decode('utf-8','replace').splitlines())
              if not rp.can_fetch(ua,url): raise ValueError('robots_disallowed')
              with request.urlopen(request.Request(url,headers={'User-Agent':ua,'Accept':'text/plain'}),timeout=18) as r:
                  raw=r.read(300001)
                  ctype=r.headers.get_content_type()
              if len(raw)>300000: raise ValueError('too_large')
              text=raw.decode('utf-8','replace')
              print('APT_PROBE',repr({'status':'READABLE','bytes':len(raw),'sha256':sha256(raw).hexdigest(),'content_type':ctype,'pgp_signed':text.startswith('-----BEGIN PGP SIGNED MESSAGE-----'),'pgp_signature': '-----BEGIN PGP SIGNATURE-----' in text,'origin_ubiquiti':'Origin: Ubiquiti Networks, Inc.' in text,'suite_stable':'Suite: stable' in text,'has_codename':'Codename:' in text}))
          except Exception as e:
              print('APT_PROBE',repr({'status':'UNAVAILABLE','error_type':type(e).__name__,'http_code':getattr(e,'code',None)}))
          PY
