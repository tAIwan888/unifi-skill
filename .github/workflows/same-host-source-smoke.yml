name: One-time official same-host source smoke test
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/same-host-source-smoke.yml'
permissions:
  contents: read
jobs:
  official-source-smoke:
    if: github.repository == 'tAIwan888/unifi-skill' && github.event.pull_request.number == 23
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test same-host security against all 25 public official sources
        shell: bash
        run: |
          set +e
          python3 scripts/check_official_updates.py > /tmp/official-redirect-probe.out 2>&1
          status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('sync/health.json').read_text())
          by_id={r['id']:r for r in health['results']}
          print('SAME_HOST_PUBLIC_SOURCE_AUDIT',json.dumps({
            'monitored':health['monitored'],
            'healthy':health['healthy'],
            'failed':health['failed'],
            'freshness':health['freshness'],
            'failures':{k:v['detail'] for k,v in by_id.items() if v['status']=='ERROR'},
            'source_approvals_recorded':0}))
          assert health['monitored']==25,health
          assert health['healthy']>=22,health
          assert by_id['unifi_updates']['status']!='ERROR'
          assert by_id['network_application_release_rss']['status']!='ERROR'
          assert by_id['network_api']['status']!='ERROR'
          assert health['freshness']=='DEGRADED'
          assert json.loads(Path('sync/reviewed.json').read_text())['reviews']=={}
          PY
          test "$status" -eq 4
