name: Validate verified-but-empty UniFi APT index (one-time)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apt-signature-probe.yml'
      - 'scripts/apt_official_index.py'
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'tAIwan888/unifi-skill' && github.event.pull_request.number == 14
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify PGP and report official empty Packages index correctly
        shell: bash
        run: |
          set +e
          python3 scripts/apt_official_index.py --output /tmp/apt-status.json
          status=$?
          set -e
          echo "APT_READER_EXIT_CODE=$status"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/apt-status.json').read_text())
          assert d['verification']=='PINNED_PGP_SIGNATURE_VALID',d
          assert d['content_status']=='SIGNED_EMPTY_PACKAGES',d
          assert d['signed_packages_size']==0
          assert d['review_status']=='NO_NEW_KNOWLEDGE'
          assert 'package_version' not in d
          print('APT_SIGNED_EMPTY_HANDLED_CORRECTLY=true')
          PY
          test "$status" -eq 2
