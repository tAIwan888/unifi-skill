name: Portable One-Shot Offline Build
on:
  pull_request:
    paths:
      - "SKILL.md"
      - "README.md"
      - "scripts/**"
      - "modules/**"
      - "runbooks/**"
      - "docs/evidence-and-acceptance.md"
      - "docs/diagnostic-evidence-contract.md"
      - "docs/portable-one-shot.md"
      - "tests/test_platform_wifi.py"
      - "tests/test_run_one_shot_output.py"
      - ".github/workflows/portable-one-shot.yml"
  push:
    paths:
      - "SKILL.md"
      - "README.md"
      - "scripts/**"
      - "modules/**"
      - "runbooks/**"
      - "docs/evidence-and-acceptance.md"
      - "docs/diagnostic-evidence-contract.md"
      - "docs/portable-one-shot.md"
      - "tests/test_platform_wifi.py"
      - "tests/test_run_one_shot_output.py"
      - ".github/workflows/portable-one-shot.yml"
permissions:
  contents: read
jobs:
  one-shot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64-candidate
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build dependencies (build job only)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            python -m pip install --disable-pip-version-check pyobjc-framework-CoreWLAN==11.1
          fi
      - name: Validate OS adapter fixtures
        shell: bash
        run: python -m unittest discover -s tests -p 'test_platform_wifi.py' -v
      - name: Build single self-contained console executable
        shell: bash
        run: python scripts/build_one_shot.py --out "$RUNNER_TEMP/unifi-one-shot-dist"
      - name: Smoke executable in pure MOCK (no private UniFi or WLAN read)
        shell: bash
        run: python scripts/smoke_one_shot_binary.py --dist "$RUNNER_TEMP/unifi-one-shot-dist"
      - name: Verify host architecture; never mislabel binary
        shell: bash
        run: |
          python -c 'import platform; print(platform.system(),platform.machine())'
          python -c 'import platform,sys; assert not ("arm64" in sys.argv[1] and platform.machine().lower() not in ("arm64","aarch64"))' "${{ matrix.platform }}"
      - name: Archive unsigned CI prototype only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prototype-one-shot-${{ matrix.platform }}
          path: ${{ runner.temp }}/unifi-one-shot-dist/unifi-skill*
          if-no-files-found: error
          retention-days: 7
