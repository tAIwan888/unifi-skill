name: UniFi Security Advisory RSS live source probe (read only)

# A branch-specific PUSH event runs on the proposal branch *before merge*;
# workflow_dispatch needs a default-branch workflow, so it is not used here.
# The second independent Runner attempt can use GitHub's Re-run jobs UI.
# No pull_request_target, no secrets, no write token.
on:
  push:
    branches:
      - feature/security-advisory-rss-read-only-probe
    paths:
      - '.github/workflows/security-advisory-rss-live-probe.yml'
      - 'scripts/probe_official_security_rss.py'
      - 'tests/test_official_security_rss_probe.py'

permissions:
  contents: read

concurrency:
  group: unifi-security-rss-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-official-security-rss:
    if: >-
      github.ref == 'refs/heads/feature/security-advisory-rss-read-only-probe' &&
      github.repository == 'tAIwan888/unifi-skill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch-push SHA (no stored credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run synthetic parser safety tests before network probe
        run: python3 -m unittest discover -s tests -p 'test_official_security_rss_probe.py' -v
      - name: Read official anonymous Security RSS (must fail closed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unifi-security-rss-proof"
          set +e
          python3 -B scripts/probe_official_security_rss.py \
            > "$RUNNER_TEMP/unifi-security-rss-proof/response.json"
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/unifi-security-rss-proof/probe-exit-code.txt"
          if [ "$result" -ne 0 ]; then
            echo '::error::Anonymous official Security RSS is NOT verified by this Runner. Preserve FAIL-CLOSED; inspect artifact.'
            exit "$result"
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads((Path(os.environ['RUNNER_TEMP'])/'unifi-security-rss-proof'/'response.json').read_text())
          if (payload.get('human_reviewed') is not False or
              payload.get('is_global_release_source') is not False or
              payload.get('status') != 'OFFICIAL_HOST_CANDIDATE_NOT_APPROVED' or
              payload.get('count',0) < 1 or
              len(payload.get('advisories',[])) != payload['count']):
              raise SystemExit('FAIL_CLOSED: result is inconsistent or accidentally marked approved')
          print('READ_ONLY_SECURITY_RSS_POINTERS', payload['count'], payload['source_digest_sha256'])
          PY
      - name: Summarize read-only evidence (never claim human approval)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '### Official Security RSS probe — still not human reviewed' >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Runner attempt: $GITHUB_RUN_ID / $GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'This is a scoped security-advisory feed, NOT a global releases/download repair.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/unifi-security-rss-proof/probe-exit-code.txt" ]; then
            printf 'Probe exit code: %s\n' "$(cat "$RUNNER_TEMP/unifi-security-rss-proof/probe-exit-code.txt")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Probe was not reached; no live source evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence artifact even when fetch fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-advisory-rss-live-probe
          path: ${{ runner.temp }}/unifi-security-rss-proof/
          retention-days: 14
          if-no-files-found: warn
