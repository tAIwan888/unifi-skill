name: Inspect official public release HTML structure (one-time PR #4)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/html-structure-probe.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.number == 4 && github.repository == 'tAIwan888/unifi-skill'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect only counts and structural markers from official HTML
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import re
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('mon',Path('scripts/check_official_updates.py'))
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          opener=mod.request.build_opener(mod.SafeRedirect())
          for url in ['https://www.ui.com/download/unifi','https://www.ui.com/download/utilities/']:
              try:
                  raw=mod.fetch(url,opener)
                  html=raw.decode('utf-8','replace')
                  markers={
                      'raw_bytes':len(raw),
                      'script_tags':len(re.findall(r'<script\\b',html,re.I)),
                      'next_data': '__NEXT_DATA__' in html,
                      'next_flight': 'self.__next_f.push' in html,
                      'network_mentions':len(re.findall(r'UniFi Network Application',html,re.I)),
                      'semver_mentions':len(re.findall(r'\\b\\d{1,3}\\.\\d{1,4}\\.\\d{1,4}\\b',html)),
                      'release_title_mentions':len(re.findall(r'Release Notes',html,re.I)),
                  }
                  print('OFFICIAL_HTML_STRUCTURE',url,json.dumps(markers))
              except Exception as e:
                  print('OFFICIAL_HTML_READ_ERROR',url,mod.error_code(e))
          PY
