name: Official UniFi Product Catalog Source Check
on:
  pull_request:
    paths:
      - "scripts/discover_official_products.py"
      - "tests/test_discover_official_products.py"
      - ".github/workflows/official-product-catalog.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-public-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify offline full-category indexing and failure modes
        run: python -m unittest discover -s tests -p test_discover_official_products.py -v
      - name: Check alternative official catalog robots endpoints without following redirects
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url): return None
          op=urllib.request.build_opener(NoRedirect)
          for domain in ["techspecs.ui.com", "ui.com", "www.ui.com", "store.ui.com"]:
              url="https://"+domain+"/robots.txt"
              try:
                  with op.open(urllib.request.Request(url,headers={"User-Agent":"UniFiSkillPublicProductIndexer/1.0"}),timeout=12) as result:
                      status=result.status
                      typ=result.headers.get("Content-Type","").split(";")[0]
                      data=result.read(3000)
                      print(domain, "robots",status,typ,"bytes_sample",len(data))
              except urllib.error.HTTPError as err:
                  loc=err.headers.get("Location","")
                  target=urllib.parse.urlsplit(urllib.parse.urljoin(url,loc))
                  print(domain,"robots",err.code,"redirect_host",target.hostname,"redirect_path",target.path[:60])
              except (OSError,TimeoutError) as err:
                  print(domain,"robots_unavailable",type(err).__name__)
          print("Vendor sitemap checks (no crawl performed):")
          for url in ["https://www.ui.com/sitemap.xml", "https://ui.com/sitemap.xml"]:
              try:
                  with op.open(urllib.request.Request(url,headers={"User-Agent":"UniFiSkillPublicProductIndexer/1.0"}),timeout=12) as result:
                      raw=result.read(1000000)
                      print(urllib.parse.urlsplit(url).hostname,"sitemap",result.status,
                            result.headers.get("Content-Type","")[:55], "bytes",len(raw))
                      import xml.etree.ElementTree as ET
                      from collections import Counter
                      try:
                          root=ET.fromstring(raw)
                          links=[e.text for e in root.iter() if e.tag.endswith("loc") and e.text]
                          counts=Counter("/".join(urllib.parse.urlsplit(u).path.split("/")[:3]) for u in links)
                          print("sitemap_types",str(counts.most_common(15))[:1600])
                          print("unifi_sample",str([u for u in links if "/unifi" in u.lower()][:10])[:1600])
                      except ET.ParseError:
                          print("sitemap XML parse error")
              except urllib.error.HTTPError as err:
                  loc=err.headers.get("Location","")
                  target=urllib.parse.urlsplit(urllib.parse.urljoin(url,loc))
                  print(urllib.parse.urlsplit(url).hostname,"sitemap",err.code,
                        "redirect_host",target.hostname,"redirect_path",target.path[:60])
              except (OSError,TimeoutError) as err:
                  print("sitemap_unavailable",type(err).__name__)
          PY
      - name: Verify official public robots and entire visible UniFi category listings
        id: public
        shell: bash
        run: |
          python scripts/discover_official_products.py --out "$RUNNER_TEMP/unifi-official-product-index.json"
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/unifi-official-product-index.json")); print("Official category coverage:",p["snapshot_status"]); print("Distinct product URLs:",p["unique_product_links"]); print("Official page SHA digests:",len(p["source_sha256"]))'
      - name: Preserve verified source index as temporary build artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unifi-official-product-catalog-source-proof
          path: ${{ runner.temp }}/unifi-official-product-index.json
          if-no-files-found: error
          retention-days: 7
