name: Verify real public Help Center article monitoring (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/public-help-api-probe.yml'
      - 'scripts/check_official_updates.py'
      - 'tests/test_public_help_api.py'
permissions:
  contents: read
jobs:
  validate-official-articles:
    if: github.repository == 'tAIwan888/unifi-skill' && github.event.pull_request.head.ref == 'feature/official-help-api-source-probe-v09'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test official public JSON articles without saving raw content
        shell: bash
        run: |
          set +e
          python3 scripts/check_official_updates.py --only unifi_updates official_api platform_intro cloud_architecture self_hosting official_hosting vlan zbf isolation l3_routing wifi switch vpn protect access identity talk backup_migration adoption > /tmp/help-probe.log 2>&1
          code=$?
          set -e
          cat /tmp/help-probe.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('sync/health.json').read_text())
          results=d['results']
          ok=[r['id'] for r in results if r['status'] != 'ERROR']
          errs={r['id']:r['detail'] for r in results if r['status']=='ERROR'}
          print('PUBLIC_ARTICLE_MONITOR_RESULT',json.dumps({
              'healthy':d['healthy'],'failed':d['failed'],
              'validated_article_ids':ok,'failed_article_ids':errs,
              'review_gate_not_bypassed':True}))
          if not {'unifi_updates','vlan'}.issubset(set(ok)):
              raise SystemExit('Expected both previously verified articles to be accepted by new monitor')
          PY
          test "$code" -eq 0
