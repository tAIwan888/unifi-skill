name: UniFi official knowledge sync (review only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-knowledge-sync.yml'
      - 'scripts/check_official_updates.py'
      - 'scripts/release_catalog.py'
      - 'scripts/apt_official_index.py'
      - 'scripts/build_review_triage.py'
      - 'sync/sources.json'
  schedule:
    - cron: '17 2 * * 2,5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unifi-official-sync
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Select existing open review PR or a new run-specific branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="$(gh pr list --state open --base "$BASE" --json headRefName,title --jq '[.[] | select(.title == "docs: official UniFi updates awaiting review") | .headRefName | select(startswith("automation/official-knowledge-sync-"))][0] // empty')"
          if [ -n "$branch" ]; then
            git fetch origin "$branch" "$BASE"
            git checkout -B "$branch" "origin/$branch"
            # Keep the open Draft PR while incorporating newly reviewed main.
            # Never force push or silently discard pending official evidence.
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-edit "origin/$BASE"
            git push origin "HEAD:$branch"
          else
            branch="automation/official-knowledge-sync-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
          fi
          echo "SYNC_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Read public official sources and capture degraded result
        shell: bash
        run: |
          set +e
          python3 scripts/check_official_updates.py
          result=$?
          set -e
          if [ "$result" -eq 2 ] || [ "$result" -eq 4 ]; then
            echo "SOURCE_DEGRADED=true" >> "$GITHUB_ENV"
            echo "::warning::Some or all official sources are unavailable or unverifiable. Health and errors will be proposed for review."
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          state=json.loads(Path('sync/health.json').read_text())
          summary=(f"### Public official-source audit\n"
                   f"- Validated: {state['healthy']} / {state['monitored']}\n"
                   f"- Failed: {state['failed']}\n"
                   f"- Coverage: {state['freshness']} — **not approved knowledge**\n"
                   f"- Article digests remain subject to human review.\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write(summary)
          print('HEALTH_SUMMARY',state['healthy'],state['failed'],state['freshness'])
          PY
      - name: Fail-closed release candidate and health evidence audit
        run: python3 scripts/validate_release_candidate_evidence.py
      - name: Verify official signed legacy APT source (no knowledge promotion)
        shell: bash
        run: |
          set +e
          python3 scripts/apt_official_index.py --output sync/legacy-network-apt-status.json
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo "::warning::Ubiquiti signed APT source is empty/unavailable; this is NOT a full UniFi release update."
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi
          echo "Legacy APT index evidence recorded. Version candidate remains UNREVIEWED."
      - name: Generate deterministic human review triage (no approval)
        shell: bash
        run: python3 scripts/build_review_triage.py --output sync/review-triage.md
      - name: Test
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Propose source changes
        id: changes
        run: |
          set -euo pipefail
          git add sync/observed.json sync/pending.json sync/latest-observed.md sync/health.json sync/version-candidates.json sync/legacy-network-apt-status.json sync/review-triage.md
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit review evidence
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: ${{ env.SYNC_BRANCH }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: detect official knowledge changes (unreviewed)"
          git push origin "HEAD:$BRANCH"
      - name: Open Draft PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ env.SYNC_BRANCH }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          open_pr="$(gh pr list --state open --head "$BRANCH" --base "$BASE" --json number --jq '.[0].number // empty')"
          if [ -z "$open_pr" ]; then
            gh pr create --draft --base "$BASE" --head "$BRANCH" --title "docs: official UniFi updates awaiting review" --body "Unreviewed official source fingerprints. Do not merge without updating knowledge, recording reviewed digests and passing CI."
          fi
      - name: Open one maintenance issue if public sources are unavailable
        if: env.SOURCE_DEGRADED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Stable issue identity is not its editable title. Issue #7 was
          # renamed after 29/31 sources recovered; matching the old exact
          # title would spawn an unnecessary duplicate on the next scan.
          # An opened, known maintenance issue takes precedence.
          issue_state="$(gh issue view 7 --repo "$GH_REPO" --json state --jq '.state' 2>/dev/null || true)"
          if [ "$issue_state" = "OPEN" ]; then
            echo "Existing maintenance issue #7 is open; no duplicate created."
            exit 0
          fi
          # If #7 was closed, only create a new issue if a later issue with
          # our machine-owned marker does not already exist.
          marker='<!-- unifi-official-source-degraded -->'
          issue="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,body --jq '[.[] | select(.body | contains("<!-- unifi-official-source-degraded -->"))][0].number // empty')"
          if [ -n "$issue" ]; then
            echo "Existing degraded-source issue #$issue; no duplicate created."
          else
            gh issue create --repo "$GH_REPO" --title "UniFi global release index and downloads remain DEGRADED — official machine data required" --body "$marker
          The scheduled public official-source reader has one or more degraded or unverified sources. Check the latest GitHub Actions official knowledge-sync run and the proposed Draft PR source health. Never promote unreviewed evidence, infer release channels, or access a private device."
          fi
      - name: Flag degraded source health
        if: env.SOURCE_DEGRADED == 'true'
        run: |
          echo "::error::Public official-source coverage is degraded. Review Draft PR and source health; do not claim complete official knowledge sync."
          exit 2
