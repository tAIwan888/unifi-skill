name: Validate recovered official-source coverage (one-time)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/all-public-sources-probe.yml'
permissions:
  contents: read
jobs:
  official-source-coverage:
    if: github.repository == 'tAIwan888/unifi-skill' && github.event.pull_request.number == 16
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Audit all 24 official sources and unreviewed provenance
        shell: bash
        run: |
          set +e
          python3 scripts/check_official_updates.py > /tmp/public-source.log 2>&1
          code=$?
          set -e
          cat /tmp/public-source.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('sync/health.json').read_text())
          observed=json.loads(Path('sync/observed.json').read_text())['sources']
          pending=json.loads(Path('sync/pending.json').read_text())['changes']
          reviewed=json.loads(Path('sync/reviewed.json').read_text())['reviews']
          wanted={'network_api':'10.6.106','site_manager_api':'1.0.0','protect_api':'7.3.70'}
          assert health['monitored']==24
          for key,v in wanted.items():
            e=observed[key]
            assert e['fetch_method']=='PUBLIC_OFFICIAL_VERSIONED_DEVELOPER_MARKDOWN',e
            assert e['doc_version']==v and e['version_scope']=='PINNED_DOCUMENT_NOT_LATEST'
            assert pending[key]['status']=='REVIEW_REQUIRED'
          assert not reviewed,'No unreviewed source may be auto-approved'
          print('SOURCE_AUDIT_FINAL',json.dumps({
            'healthy':health['healthy'],'failed':health['failed'],
            'freshness':health['freshness'],
            'errors':{x['id']:x['detail'] for x in health['results'] if x['status']=='ERROR'},
            'pending_count':len(pending),'developer_docs_validated':list(wanted)
          }))
          PY
          test "$code" -eq 4
