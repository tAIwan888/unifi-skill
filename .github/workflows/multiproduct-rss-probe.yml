name: One-time official multi-product release RSS probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/multiproduct-rss-probe.yml'
permissions:
  contents: read
jobs:
  official-rss-probe:
    if: github.repository == 'tAIwan888/unifi-skill' && github.event.pull_request.head.ref == 'feature/scoped-official-multi-product-release-rss-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Probe public official RSS with existing robots and same-host redirect checks
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util,json,xml.etree.ElementTree as ET
          from urllib import request
          from pathlib import Path
          p=Path("scripts/check_official_updates.py")
          spec=importlib.util.spec_from_file_location("monitor",p)
          mon=importlib.util.module_from_spec(spec);spec.loader.exec_module(mon)
          feeds={
             "protect":"https://community.ui.com/rss/releases/UniFi-Protect-Application/aada5f38-35d4-4525-9235-b14bd320e4d0",
             "os_server":"https://community.ui.com/rss/releases/UniFi-OS-Server/76650b06-fc47-4892-9c12-25c64c39f842",
             "dream_machines":"https://community.ui.com/rss/releases/UniFi-OS-Dream-Machines/b0f0a740-021e-4027-a778-ceba983be74b",
             "uap_usw":"https://community.ui.com/rss/releases/UAP-USW-Firmware/9fc3b2fa-9e73-449a-924f-470e79884470",
             "unifi_switch":"https://community.ui.com/rss/releases/UniFi-Switch/f5882c6b-e77f-45c1-b019-68fd20000c31",
             "security":"https://community.ui.com/rss/releases/Security/f3f45fa2-1784-4594-b48d-28baf317b208"
          }
          opener=request.build_opener(mon.SafeRedirect())
          for id,url in feeds.items():
            try:
              mon._robot_ok(url,opener)
              with opener.open(request.Request(url,headers={"User-Agent":mon.UA,"Accept":"application/rss+xml, application/xml"}),timeout=18) as response:
                ctype=response.headers.get_content_type()
                raw=response.read(mon.LIMIT+1)
              if len(raw)>mon.LIMIT:raise ValueError("too_large")
              if b"<!DOCTYPE" in raw.upper() or b"<!ENTITY" in raw.upper():raise ValueError("invalid_xml")
              root=ET.fromstring(raw)
              rows=root.findall("./channel/item")
              samples=[]
              for x in rows[:5]:
                samples.append({
                  "title":(x.findtext("title") or "")[:120],
                  "categories":[(e.text or "")[:60] for e in x.findall("category")][:4],
                  "link":(x.findtext("link") or "")[:180],
                  "pubDate":(x.findtext("pubDate") or "")[:50]
                })
              print("MULTI_RSS_PROBE",json.dumps({"id":id,"status":"XML_VALID","ctype":ctype,
                 "root":root.tag,"items":len(rows),"samples":samples},ensure_ascii=False))
            except Exception as e:
              print("MULTI_RSS_PROBE",json.dumps({"id":id,"status":"UNVERIFIED",
                   "category":type(e).__name__,"code":getattr(e,"code",None)}))
          PY
      - name: Verify all 30 official catalog sources with the real parser
        shell: bash
        run: |
          set +e
          python3 scripts/check_official_updates.py > /tmp/public-30-source.log 2>&1
          code=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path("sync/health.json").read_text())
          candidates=json.loads(Path("sync/version-candidates.json").read_text())["sources"]
          pending=json.loads(Path("sync/pending.json").read_text())["changes"]
          by_id={x["id"]:x for x in health["results"]}
          new=("protect_application_release_rss","os_server_release_rss",
               "dream_machines_release_rss","wifi_firmware_release_rss",
               "switch_firmware_release_rss")
          assert health["monitored"]==30,health
          assert health["healthy"]>=28,health
          assert health["failed"]==2,health
          assert health["freshness"]=="DEGRADED"
          assert health["unavailable_release_candidate_sources"]==["official_releases","software_downloads"],health
          assert len(pending)==28,len(pending)
          report={}
          for key in new:
            assert by_id[key]["status"]=="FIRST_SEEN",(key,by_id[key])
            row=candidates[key]
            assert row["source_status"]=="VALIDATED_THIS_RUN"
            assert row["release_channel"]=="UNKNOWN_NOT_VALIDATED_FROM_RSS"
            assert row["candidates"],key
            assert all(x["verification"]=="CANDIDATE_UNREVIEWED" for x in row["candidates"])
            assert all(x["release_channel"]=="UNKNOWN_NOT_VALIDATED_FROM_RSS" for x in row["candidates"])
            assert pending[key]["status"]=="REVIEW_REQUIRED"
            report[key]=len(row["candidates"])
          assert all(by_id[k]["status"]=="ERROR" for k in ("official_releases","software_downloads"))
          assert json.loads(Path("sync/reviewed.json").read_text())["reviews"]=={}
          print("FULL_30_PUBLIC_SOURCES_VERIFIED",json.dumps({
            "healthy":health["healthy"],"failed":health["failed"],
            "total_pending":len(pending),"new_release_candidates":report,
            "global_release_feeds_still_degraded":2,
            "automatically_approved":0
          },sort_keys=True))
          PY
          test "$code" -eq 4
